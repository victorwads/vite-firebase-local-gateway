services:
  proxy:
    image: node:24-alpine
    working_dir: /workspace
    ports:
      - "80:8080"
      - "443:4433"
    volumes:
      # Persist npm cache so npx installs are fast after the first run
      - proxy_npm_cache:/root/.npm
      # Persist generated certs/CA (defaults to ./certs inside the working dir)
      - ${HOME}/.proxy/certs:/workspace/certs
      # Versionable config owned by the project (recommended)
      - ./gateway.config.js:/workspace/gateway.config.js:ro
      # Optional: required only if you want the built-in Firebase plugin
      # - ./firebase.json:/workspace/firebase.json:ro
    environment:
      # Optional: Basic Auth is enabled only if both are set and non-empty
      PROXY_BASIC_AUTH_USER: ""
      PROXY_BASIC_AUTH_PASS: ""
      PROXY_BASIC_AUTH_REALM: "Firebase Local Gateway"
    command: npx --yes vite-firebase-local-gateway start --config /workspace/gateway.config.js

volumes:
  proxy_npm_cache:
