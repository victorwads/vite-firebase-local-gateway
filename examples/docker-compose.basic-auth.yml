services:
  proxy:
    restart: always
    image: node:24-alpine
    working_dir: /app
    volumes:
      - proxy_temp:/app/node_modules
      - proxy_temp:/tmp
      - proxy_temp:/usr/local/share/.cache
      - ./firebase.json:/firebase.json:ro
      - ./Web/proxy:/app
    ports:
      - "443:4433"
      - "80:8080"
    command:
      - sh
      - -c
      - apk add --no-cache openssl && yarn install && yarn proxy
    env_file:
      - ./.basicAuth.env
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:8080/_proxy/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - autoheal=true

  # Optional: restart containers that become unhealthy.
  # Docker Compose by itself marks a container as unhealthy but does not restart it.
  autoheal:
    image: willfarrell/autoheal
    restart: always
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  proxy_temp:
